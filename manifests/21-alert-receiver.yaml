# Minimal Alertmanager webhook receiver + live page (stands in for e-mail/Slack/ITSM in the PoC).
apiVersion: v1
kind: ConfigMap
metadata:
  name: aigov-alert-receiver
  namespace: ${DEMO_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
data:
  app.py: |
    import html, json, datetime
    from urllib.parse import urlparse, parse_qs
    from http.server import BaseHTTPRequestHandler, HTTPServer
    EVENTS = []
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
            now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
            for a in body.get("alerts", []):
                EVENTS.insert(0, {"received": now, "status": a.get("status"), "alert": a["labels"].get("alertname"),
                                  "team": a["labels"].get("subscription"), "severity": a["labels"].get("severity"),
                                  "summary": a.get("annotations", {}).get("summary", ""), "startsAt": a.get("startsAt")})
                print(json.dumps(EVENTS[0]), flush=True)
            del EVENTS[200:]
            self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
        def do_GET(self):
            q = parse_qs(urlparse(self.path).query)
            team = (q.get("team") or [None])[0]
            events = [e for e in EVENTS if not team or e.get("team") == team]
            if self.path.startswith("/api"):
                out = json.dumps(events).encode(); ctype = "application/json"
            else:
                rows = "".join(
                    f"<tr class='{html.escape(str(e['severity']))} {html.escape(str(e['status']))}'><td>{html.escape(e['received'])}</td>"
                    f"<td>{html.escape(str(e['status']))}</td><td>{html.escape(str(e['alert']))}</td><td>{html.escape(str(e['team']))}</td>"
                    f"<td>{html.escape(str(e['severity']))}</td><td>{html.escape(e['summary'])}</td></tr>" for e in events)
                out = ("<html><head><meta http-equiv='refresh' content='5'><title>Acme Bank budget alerts</title><style>"
                       "body{font-family:sans-serif;margin:2em}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px}"
                       ".warning{background:#fff4d6}.critical{background:#ffd6d6}.resolved{background:#e6ffe6}</style></head><body>"
                       "<h2>Acme Bank AI platform: team budget alerts</h2><p>Alertmanager webhook receiver (auto-refresh 5s)" + (f" · team: {html.escape(team)}" if team else "") + "</p>"
                       "<table><tr><th>Received</th><th>Status</th><th>Alert</th><th>Team</th><th>Severity</th><th>Summary</th></tr>"
                       + (rows or "<tr><td colspan=6>No alerts yet</td></tr>") + "</table></body></html>").encode()
                ctype = "text/html"
            self.send_response(200); self.send_header("Content-Type", ctype); self.end_headers(); self.wfile.write(out)
    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aigov-alert-receiver
  namespace: ${DEMO_NS}
  labels: {app: aigov-alert-receiver, app.kubernetes.io/part-of: ${PART_OF}}
spec:
  replicas: 1
  selector: {matchLabels: {app: aigov-alert-receiver}}
  template:
    metadata: {labels: {app: aigov-alert-receiver}}
    spec:
      containers:
        - name: receiver
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/app/app.py"]
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: aigov-alert-receiver}}]
---
apiVersion: v1
kind: Service
metadata:
  name: aigov-alert-receiver
  namespace: ${DEMO_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
spec:
  selector: {app: aigov-alert-receiver}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aigov-alert-receiver
  namespace: ${DEMO_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
spec:
  to: {kind: Service, name: aigov-alert-receiver}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}

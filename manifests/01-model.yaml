# Demo models, published through Models-as-a-Service (MaaS).
#  - aigov-qwen3-8b : Red Hat validated Qwen3-8B FP8 (model catalog source redhat_ai_validated_models) on llm-d, 1 GPU.
#      --enable-force-include-usage : usage block on every response (incl. streaming) so the gateway can meter tokens
#      --default-chat-template-kwargs: Qwen3 "thinking" off, so guardrail self-checks and answers are short and fast
#  - aigov-small    : CPU-only llm-d inference simulator (no GPU). Used as the "model your app is NOT allowed to call" (B4).
# ${LLM_TEMPLATE} is detected by scripts/lib.sh (newest RHOAI *-single-node-template-nvidia-cuda LLMInferenceServiceConfig).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: aigov-qwen3-8b
  namespace: ${MODEL_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
spec:
  baseRefs:
    - name: ${LLM_TEMPLATE}
  model:
    name: ${MODEL_SERVED_NAME}
    uri: ${MODEL_URI}
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --max-model-len=16384
              --enable-auto-tool-choice
              --tool-call-parser=hermes
              --enable-force-include-usage
              --default-chat-template-kwargs '{"enable_thinking": false}'
        resources:
          requests: {cpu: "2", memory: 12Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "3", memory: 24Gi, nvidia.com/gpu: "1"}
    tolerations:
      - {effect: NoSchedule, key: nvidia.com/gpu, operator: Exists}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: aigov-qwen3-8b
  namespace: ${MODEL_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
spec:
  modelRef: {kind: LLMInferenceService, name: aigov-qwen3-8b}
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: aigov-small
  namespace: ${MODEL_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
spec:
  model:
    name: facebook/opt-125m
    uri: hf://sshleifer/tiny-gpt2
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.7.1
        command: [/app/llm-d-inference-sim]
        args: ["--port=8000", "--model=facebook/opt-125m", "--mode=echo",
               "--ssl-certfile=/var/run/kserve/tls/tls.crt", "--ssl-keyfile=/var/run/kserve/tls/tls.key"]
        ports: [{containerPort: 8000, protocol: TCP}]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        readinessProbe:
          httpGet: {path: /health, port: 8000, scheme: HTTPS}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: aigov-small
  namespace: ${MODEL_NS}
  labels: {app.kubernetes.io/part-of: ${PART_OF}}
spec:
  modelRef: {kind: LLMInferenceService, name: aigov-small}
